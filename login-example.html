<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Example light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        /* Custom class for overlapping effect */
        .logo-overlap {
            position: relative;
            z-index: 2; /* Ensures logo is above the card */
            margin-bottom: -50px; /* Adjust this value as needed for desired overlap */
            /* You might need to adjust top or transform-y for precise vertical alignment */
        }
        .card-container {
            position: relative;
            z-index: 1; /* Ensures card is below the logo */
            width: 100%;
            max-width: 400px; /* Example max width for the card */
        }
    </style>
</head>
<body>
    <div class="card-container">
        <!-- Logo Image -->
        <div class="text-center logo-overlap">
            <img src="path/to/your/logo.png" alt="Logo" class="img-fluid" width="200">
        </div>

        <!-- White Card Container -->
        <div class="card shadow rounded-3">
            <div class="card-body p-4">
                <!-- Login Form Content Goes Here -->
                <h5 class="card-title text-center mb-4">Login</h5>
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password">
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
